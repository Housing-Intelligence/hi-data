# This is a Databricks asset bundle definition for housing_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: housing_intelligence
  uuid: d8104635-67df-42a3-97c1-9e7a76ed7942

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  sql_warehouse_id:
    description: The sql warehouse id

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: production
    default: true
    workspace:
      host: https://dbc-25bc283e-e602.cloud.databricks.com/
      root_path: /Workspace/Users/alviswhyi@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      sql_warehouse_id: d7b2242c06878f1d
  prod:
    mode: production
    workspace:
      host: https://dbc-25bc283e-e602.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/alviswhyi@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alviswhyi@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: alviswhyi@gmail.com
        level: CAN_MANAGE
